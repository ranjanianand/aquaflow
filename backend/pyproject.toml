[project]
name = "mwts-pipeline"
version = "0.1.0"
description = "Raw PLC gateway JSON -> normalise, clean, convert -> PostgreSQL"
requires-python = ">=3.11"

# The core pipeline is standard library only. json, csv, dataclasses, datetime,
# pathlib, collections and logging cover everything from parsing to conversion.
#
# That is not minimalism for its own sake. Every dependency here is one more
# thing to pin, patch, audit for licence, and explain to whoever inherits this.
dependencies = []

[project.optional-dependencies]

# Writing to Postgres. psycopg 3, not psycopg2 — v3 pipelines executemany, so
# the old execute_values workaround is no longer needed.
db = ["psycopg[binary]>=3.1"]

# Reading from S3, Azure Blob or GCS. boto3 also talks to MinIO, so the local
# stack and production use the same client with a different endpoint URL.
cloud = ["boto3>=1.34"]

# Orchestration. Not needed on day one — there are no scheduled jobs yet and a
# cron job does the same work. Add it when there is something to orchestrate,
# or when the client needs retries and backfill demonstrated.
airflow = ["apache-airflow>=2.8", "apache-airflow-providers-amazon"]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",          # lint + format: replaces black, isort and flake8
  "mypy>=1.11",
]

# Only if profiling proves they are needed:
#   orjson  — 2-5x faster JSON. Worth it above a few thousand files, noise below.
#   polars  — for batch analysis across days. Do NOT reach for a dataframe to
#             loop over 52 rows; the import costs more than the work.
fast = ["orjson>=3.10", "polars>=1.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]   # DTZ catches naive datetimes

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
